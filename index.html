<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Святыни в пути</title>
    <meta
      name="description"
      content="Интерактивный проект о судьбах христиан и святынь Гродненщины в годы Первой мировой войны: хроника, карта 1913 года, досье икон, сказание в картинах и игра «Дорога 1915». XV Коложские чтения." />
    <meta name="author" content="Дмитрий Скутов" />
    <meta name="theme-color" content="#EEEDE8" />

    <!-- превью ссылки в мессенджерах -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Святыни в пути" />
    <meta
      property="og:description"
      content="Хроника, карта, сказание в картинах и игра о Гродненщине 1914–1918 годов. К 110-летию прославления Августовской иконы Божией Матери." />
    <meta
      property="og:image"
      content="https://dmitrymakarchikov.github.io/svyatyni-v-puti/img/icon-augustow.jpg" />

    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <script>
      /* добавляет в <head> ссылку-подсказку браузеру */
      const addLink = (attrs) => document.head.append(Object.assign(document.createElement('link'), attrs));

      /* на сайте (http/https): приложение PWA и заранее два главных шрифта, чтобы текст не «прыгал».
         Из папки (file://) браузер такие запросы блокирует, а шрифты и так грузятся из CSS */
      if (location.protocol !== 'file:') {
        addLink({ rel: 'manifest', href: 'manifest.webmanifest' });
        ['forum-400-cyrillic', 'literata-400-700-cyrillic'].forEach((name) =>
          addLink({
            rel: 'preload',
            as: 'font',
            type: 'font/woff2',
            crossOrigin: 'anonymous',
            href: `fonts/${name}.woff2`
          })
        );
      }

      /* открытку с первого экрана грузим заранее, только если посетитель открыл главную */
      if (!location.hash || location.hash === '#home') {
        addLink({ rel: 'preload', as: 'image', href: 'img/thumbs/kolozha-1915.jpg', fetchPriority: 'high' });
      }
    </script>
    <link rel="stylesheet" href="css/style.css" />

    <!-- порядок важен: данные → общие функции → разделы → запуск -->
    <script src="js/data.js" defer></script>
    <script src="js/core.js" defer></script>
    <script src="js/pages/home.js" defer></script>
    <script src="js/pages/chronicle.js" defer></script>
    <script src="js/pages/map.js" defer></script>
    <script src="js/pages/shrines.js" defer></script>
    <script src="js/pages/comic.js" defer></script>
    <script src="js/pages/game.js" defer></script>
    <script src="js/pages/archive.js" defer></script>
    <script src="js/pages/family.js" defer></script>
    <script src="js/pages/quiz.js" defer></script>
    <script src="js/pages/about.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main" data-i="skip">К содержанию</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="#home">
          <svg class="logo__icon" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="18.6" fill="none" stroke="#1E3A6B" stroke-width="1.2" />
            <circle cx="20" cy="20" r="16" fill="none" stroke="#A9823D" stroke-width=".8" />
            <path
              d="M20 8v24M13.5 15.5h13M16 11.5h8M15 26.5l10-3.2"
              stroke="#1E3A6B"
              stroke-width="2"
              stroke-linecap="square"
              fill="none" />
          </svg>
          <span class="logo__text" data-i="brand">Святыни в пути</span>
        </a>

        <nav class="main-nav" aria-label="Разделы" data-i-label="navLabel">
          <ul class="main-nav__list">
            <li><a class="main-nav__link" href="#chronicle" data-i="nav.chronicle">Хроника</a></li>
            <li><a class="main-nav__link" href="#map" data-i="nav.map">Карта</a></li>
            <li><a class="main-nav__link" href="#shrines" data-i="nav.shrines">Святыни</a></li>
            <li><a class="main-nav__link" href="#comic" data-i="nav.comic">Сказание</a></li>
            <li><a class="main-nav__link" href="#game" data-i="nav.game">Игра</a></li>
            <li><a class="main-nav__link" href="#archive" data-i="nav.archive">Архив</a></li>
          </ul>
        </nav>

        <div class="site-header__tools">
          <button class="passport-btn" id="pass-btn" type="button" title="Путевой лист">
            <svg
              class="passport-btn__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" />
              <circle cx="12" cy="12" r="5.5" />
              <path d="M9.6 12.2l1.7 1.7 3.2-3.4" />
            </svg>
            <span class="passport-btn__label" data-i="stampsShort">Печати</span>
            <span class="passport-btn__count" id="pass-n">0/6</span>
          </button>

          <div class="lang-switch" role="group" aria-label="Язык / Мова">
            <button
              class="lang-switch__btn"
              type="button"
              data-lang="ru"
              aria-pressed="true"
              aria-label="РУС — русский язык"
              title="Русский">
              <svg class="lang-switch__flag" viewBox="0 0 30 20" aria-hidden="true">
                <rect width="30" height="20" fill="#fff" />
                <rect y="6.67" width="30" height="6.67" fill="#0039A6" />
                <rect y="13.33" width="30" height="6.67" fill="#D52B1E" />
              </svg>
              <span class="lang-switch__code">РУС</span>
            </button>
            <button
              class="lang-switch__btn"
              type="button"
              data-lang="be"
              aria-pressed="false"
              aria-label="БЕЛ — беларуская мова"
              title="Беларуская">
              <svg class="lang-switch__flag" viewBox="0 0 30 20" aria-hidden="true">
                <rect width="30" height="20" fill="#C8313E" />
                <rect y="13.33" width="30" height="6.67" fill="#4AA657" />
                <rect width="4.6" height="20" fill="#fff" />
                <g fill="#C8313E">
                  <path d="M2.3 1l1.3 1.6-1.3 1.6L1 2.6z" />
                  <path d="M2.3 5.4l1.3 1.6-1.3 1.6L1 7z" />
                  <path d="M2.3 9.8l1.3 1.6-1.3 1.6L1 11.4z" />
                  <path d="M2.3 14.2l1.3 1.6-1.3 1.6L1 15.8z" />
                </g>
              </svg>
              <span class="lang-switch__code">БЕЛ</span>
            </button>
          </div>

          <button
            class="menu-btn"
            id="burger"
            type="button"
            aria-expanded="false"
            aria-controls="drawer"
            aria-label="Меню"
            data-i-label="menu">
            <svg
              class="menu-btn__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- мобильное меню (до 1100px) -->
    <nav class="mobile-nav" id="drawer" aria-label="Меню" data-i-label="menu">
      <ul>
        <li><a class="mobile-nav__link" href="#home" data-i="nav.home">Главная</a></li>
        <li><a class="mobile-nav__link" href="#chronicle" data-i="nav.chronicle">Хроника</a></li>
        <li><a class="mobile-nav__link" href="#map" data-i="nav.map">Карта</a></li>
        <li><a class="mobile-nav__link" href="#shrines" data-i="nav.shrines">Святыни</a></li>
        <li><a class="mobile-nav__link" href="#comic" data-i="nav.comic">Сказание</a></li>
        <li><a class="mobile-nav__link" href="#game" data-i="nav.game">Игра</a></li>
        <li><a class="mobile-nav__link" href="#archive" data-i="nav.archive">Архив</a></li>
        <li><a class="mobile-nav__link" href="#quiz" data-i="nav.quiz">Викторина</a></li>
        <li><a class="mobile-nav__link" href="#about" data-i="nav.about">О проекте</a></li>
      </ul>
    </nav>

    <!-- разделы заполняются из js/pages/*.js, виден один — по адресу после # -->
    <main class="site-main" id="main" tabindex="-1">
      <section class="page" id="v-home" aria-labelledby="t-home"></section>
      <section class="page" id="v-chronicle" aria-labelledby="t-chronicle"></section>
      <section class="page" id="v-map" aria-labelledby="t-map"></section>
      <section class="page" id="v-shrines" aria-labelledby="t-shrines"></section>
      <section class="page" id="v-comic" aria-labelledby="t-comic"></section>
      <section class="page" id="v-game" aria-labelledby="t-game"></section>
      <section class="page" id="v-archive" aria-labelledby="t-archive"></section>
      <section class="page" id="v-quiz" aria-labelledby="t-quiz"></section>
      <section class="page" id="v-about" aria-labelledby="t-about"></section>
      <!-- «Назад / Дальше» по разделам 1–7, заполняется в main.js -->
      <nav class="pager" id="pager" aria-label="Разделы по порядку" data-i-label="pagerLabel" hidden></nav>
      <noscript>
        <p class="noscript">Для работы сайта включите JavaScript. · Для працы сайта ўключыце JavaScript.</p>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p data-i="foot1">XV Коложские чтения · Гродно</p>
        <a class="site-footer__link" href="#about" data-i="footAbout">О проекте и источники</a>
      </div>
    </footer>

    <!-- окно документа, досье и путевого листа -->
    <dialog class="modal" id="modal" aria-labelledby="m-title">
      <button class="modal__close" type="button" aria-label="Закрыть" data-i-label="close">✕</button>
      <div class="modal__body" id="modal-body"></div>
    </dialog>

    <!-- просмотр сказания по картинам -->
    <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
      <h2 class="visually-hidden" id="viewer-title" data-i="comic">Сказание</h2>
      <div class="viewer__stage" id="vp"></div>
      <div class="viewer__bar">
        <button class="button button--small" type="button" id="v-prev" aria-label="Назад" data-i-label="prev">
          ←
        </button>
        <span class="caption viewer__count" id="v-n"></span>
        <button
          class="button button--small"
          type="button"
          id="v-next"
          aria-label="Дальше"
          data-i-label="next">
          →
        </button>
        <button class="button button--small" type="button" id="v-close" data-i="close">Закрыть</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast__mark" aria-hidden="true"></span>
      <span class="toast__text" id="toast-t"></span>
    </div>
  </body>
</html>
